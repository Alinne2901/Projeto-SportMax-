
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="website icon" href="./imagem/Logo-icon.png">
    <link rel="stylesheet" href="./style/cadastro.css">
    <title>Cadastro SportMax</title>
</head>
<body>
    <header>
        <div class="cabecalho">
            <div class="logo">
                <img src="./imagem/Logo.jpeg" alt="Logo SportMax" class="logo__img">
            </div>

            <nav>
                <a href="./index.html">Home</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="cadastro">
            <form id="cadastro-form">
                <h1>Cadastrar-se</h1>
                <p class="Acesso">Crie sua conta para continuar</p>
                <input name="email" placeholder="E-mail" type="email" required />
                <input name="senha" placeholder="Senha" type="password" required />
                <input name="confirma_senha" placeholder="Confirmar Senha" type="password" required />
                <input name="cpf" placeholder="CPF" type="text" maxlength="14" required />
                <button type="submit" class="botao__entrar">Cadastrar</button>
                <p>Não tem conta? <a href="./login.html">Login</a></p>
            </form>
        </div>
    </main> 

    <script>
    document.getElementById('cadastro-form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const email = this.email.value;
        const senha = this.senha.value;
        const confirmaSenha = this.confirma_senha.value;
        const cpf = this.cpf.value;

        if (senha !== confirmaSenha) {
            alert("As senhas não coincidem.");
            return;
        }

        try {
            const resposta = await fetch("http://localhost:3000/cadastro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, senha, cpf })
            });

            const dados = await resposta.json();

            if (resposta.ok) {
                alert("Cadastro realizado com sucesso!");
                window.location.href = "login.html";
            } else {
                alert("Erro: " + dados.message);
            }


        } catch (erro) {
            console.error("Erro ao conectar com a API:", erro);
            alert("Erro na conexão com o servidor.");
        }
    });
    </script>

    <script>
        const cpfInput = document.querySelector('input[name="cpf"]');

        cpfInput.addEventListener('input', function(e) {
        let valor = e.target.value;

        // Remove tudo que não for número
        valor = valor.replace(/\D/g, '');

        // Limita o tamanho em 11 dígitos
        if (valor.length > 11) {
            valor = valor.slice(0, 11);
        }

        // Formata o CPF: 000.000.000-00
        valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
        valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
        valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

        e.target.value = valor;
        });
</script>

</body>
</html>
